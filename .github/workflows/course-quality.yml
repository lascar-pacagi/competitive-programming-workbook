name: Course quality

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  structural-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reject personal code in public stubs
        run: python3 tools/check_student_stubs.py

      - name: Audit course packages
        run: python3 tools/audit_course.py

      - name: Compile Python tooling
        run: python3 -m compileall -q tools
